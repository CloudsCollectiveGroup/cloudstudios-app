<style>
/* VOICE: nüchterner Kontrollraum, knapp, deutsch
   IDEA: Studio-Mischpult bei Nacht: drei Kanäle (Intern, Kunde, Partner) auf einem Pult
   PICTURE: der Belegungsplan als Lichtbalken pro Raum, Guthaben-Ring beim Kunden

:root{color-scheme:dark;--bg:#07070A;--glas:rgba(255,255,255,.05);--rand:rgba(255,255,255,.11);--ink:#F2F2F0;--leise:#A3A3A8;--gelb:#4DA3FF;--marke:#F4C430;
--gruen:#34C77B;--blau:#4C8DFF;--lila:#A77BFF;--rot:#FF5A5F;--grau:#8A8F98}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:#05060B;color:var(--ink);font:15px/1.5 Inter,-apple-system,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
background:radial-gradient(40% 35% at 15% 10%,rgba(77,163,255,.38),transparent 70%),radial-gradient(35% 30% at 90% 25%,rgba(167,123,255,.30),transparent 70%),radial-gradient(45% 40% at 70% 95%,rgba(52,199,180,.22),transparent 70%),radial-gradient(30% 30% at 10% 80%,rgba(76,141,255,.25),transparent 70%);filter:blur(20px);animation:wabern 24s ease-in-out infinite alternate}
@keyframes wabern{to{transform:translate3d(-3%,2%,0) scale(1.06)}}
@media(prefers-reduced-motion:reduce){body::before{animation:none}}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:500;margin:0;line-height:1.1}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 4px 14px rgba(0,0,0,.25);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);padding:0 14px;transition:transform .15s ease,background .2s ease}
button:active:not(:disabled){transform:scale(.97)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gelb);outline-offset:2px}
button.primaer{background:linear-gradient(180deg,#7BBDFF,#3E8EF0);color:#04101F;border:1px solid rgba(255,255,255,.45);font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 24px rgba(77,163,255,.45),0 6px 18px rgba(0,0,0,.3)}
button.aktiv{background:linear-gradient(180deg,rgba(123,189,255,.95),rgba(62,142,240,.95));color:#04101F;border-color:rgba(255,255,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 18px rgba(77,163,255,.4)}
button:disabled{opacity:.45;cursor:not-allowed}
select,input{min-height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:0 12px;font-size:16px}
select option{background:#141821}
label{font-size:12px;color:var(--leise);display:flex;flex-direction:column;gap:4px}
.mono{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--leise);letter-spacing:.08em}
.kopf{position:sticky;top:0;z-index:5;background:rgba(7,7,10,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--rand);padding:12px max(4vw,14px);display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.logo{font-family:'Space Grotesk';font-weight:700;letter-spacing:.2em;font-size:18px;display:flex;align-items:center;gap:6px}
.logo svg{filter:drop-shadow(0 0 6px rgba(244,196,48,.8))}
.kanaele{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.inhalt{padding:20px max(4vw,14px) 60px;max-width:1320px;margin:0 auto}
.karte{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.04) 55%,rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.17);border-radius:22px;padding:14px 16px;backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(255,255,255,.06),0 12px 34px rgba(0,0,0,.35)}
.raster{display:grid;gap:12px}
.kacheln{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.zahl{font-family:'Space Grotesk';font-weight:700;font-size:clamp(24px,3vw,32px)}
.zeile{display:flex;justify-content:space-between;gap:10px;align-items:center}
.plan{display:flex;flex-direction:column;gap:8px}
.planzeile{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px;align-items:center}
.bahn{position:relative;height:50px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.block{position:absolute;top:3px;bottom:3px;border-radius:9px;backdrop-filter:blur(6px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);padding:4px 7px;overflow:hidden;font-size:11px;line-height:1.25;border-left:3px solid;cursor:default}
.block b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.f-gruen{background:rgba(52,199,123,.18);border-color:var(--gruen);color:#BDF2D6}
.f-blau{background:rgba(76,141,255,.2);border-color:var(--blau);color:#CFE0FF}
.f-lila{background:rgba(167,123,255,.2);border-color:var(--lila);color:#E2D6FF}
.f-rot{background:rgba(255,90,95,.2);border-color:var(--rot);color:#FFD2D3}
.f-grau{background:rgba(138,143,152,.2);border-color:var(--grau);color:#D8DAE0}
.f-belegt{background:repeating-linear-gradient(135deg,rgba(255,255,255,.1) 0 6px,rgba(255,255,255,.04) 6px 12px);border-color:rgba(255,255,255,.25);color:#C9C9CE}
.jetzt{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--gelb);box-shadow:0 0 10px var(--gelb);pointer-events:none}
.achse{display:flex;justify-content:space-between;margin-left:98px;font-family:'JetBrains Mono';font-size:10px;color:var(--leise)}
.tage{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tage button{flex:none;min-width:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 8px;line-height:1.2}
.legende{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:#C9C9CE}
.legende i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.zweispaltig{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}
@media(max-width:960px){.zweispaltig{grid-template-columns:minmax(0,1fr)}}
.handy{max-width:410px;margin:0 auto;border-radius:34px;border:1px solid var(--rand);background:#07070A;padding:18px 16px 12px;box-shadow:0 30px 80px rgba(0,0,0,.6);position:relative;min-height:760px;display:flex;flex-direction:column}
.handynav{margin-top:auto;display:flex;justify-content:space-around;border-top:1px solid var(--rand);padding-top:8px}
.handynav button{border:none;background:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;font-size:11px;color:#B9BCC6;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;min-width:56px;border-radius:24px;flex:1}
.handynav button.aktiv{color:#9CCBFF;background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.toast{position:absolute;left:12px;right:12px;top:12px;z-index:3;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%);border:1px solid rgba(255,255,255,.25);border-radius:22px;padding:10px 12px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:rein .3s ease}
@keyframes rein{from{transform:translateY(-10px);opacity:0}}
@media(prefers-reduced-motion:reduce){.toast{animation:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.liste{display:flex;flex-direction:column;gap:8px}
.hinweis{font-size:12px;color:var(--leise)}
.fehler{border-color:rgba(255,90,95,.5);background:rgba(255,90,95,.1)}
.ok{border-color:rgba(52,199,123,.5);background:rgba(52,199,123,.1)}
.ring{display:block}
.pruef{font-size:13px}
.pruef li{margin:4px 0}
.ab-weg{display:none}
#dev{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#dev .knopf{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.25);color:#CFE4FF;font-size:13px;font-weight:600}
#test .banner{position:fixed;left:10px;right:58px;top:max(10px,env(safe-area-inset-top));z-index:19;max-width:430px;padding:10px 12px;border-radius:20px;background:linear-gradient(180deg,rgba(30,50,90,.92),rgba(16,24,44,.92));backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(77,163,255,.55);box-shadow:0 12px 40px rgba(0,0,0,.55);font-size:14px;line-height:1.35}
#test .blatt{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
#test .blatt>div{width:min(480px,100%);max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(32,36,48,.97),rgba(14,16,22,.98));border:1px solid rgba(255,255,255,.16)}
.testlauf .handy{padding-top:170px!important}
#dev .panel{width:min(290px,calc(100vw - 20px));background:linear-gradient(180deg,rgba(40,44,56,.85),rgba(20,22,30,.85));backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.2);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.vollbild{padding:0!important;max-width:none!important}
.vollbild .handy{max-width:480px;margin:0 auto;border:none;border-radius:0;box-shadow:none;background:transparent;min-height:100vh;min-height:100dvh;padding:18px 16px calc(120px + env(safe-area-inset-bottom))}
.vollbild .handynav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:456px;border:1px solid rgba(255,255,255,.2);border-radius:32px;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));backdrop-filter:blur(28px) saturate(190%);-webkit-backdrop-filter:blur(28px) saturate(190%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 16px 40px rgba(0,0,0,.5);padding:6px;z-index:4}
.vollbild .toast{position:fixed;left:50%;transform:translateX(-50%);width:min(456px,calc(100vw - 24px));top:12px}

body.live #dev,body.live #test{display:none!important}
#live-leiste{display:flex;justify-content:center;margin-top:-90px;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.vollbild .handy{padding-top:calc(18px + env(safe-area-inset-top))}
.vollbild .toast{top:calc(12px + env(safe-area-inset-top))}

/* ---------- Große Bildschirme: iPad, MacBook, Mac Studio ---------- */
@media (min-width: 820px) {
  .vollbild .handy{max-width:1320px;padding:calc(28px + env(safe-area-inset-top)) 36px 56px 140px}
  .vollbild .handynav{left:18px;top:50%;bottom:auto;transform:translateY(-50%);width:100px;max-width:none;flex-direction:column;justify-content:flex-start;gap:6px;padding:12px 8px;border-radius:30px}
  .vollbild .handynav button{flex:none;min-height:66px;width:100%;font-size:11.5px}
  .vollbild .toast{left:calc(50% + 60px)}
  .handy form{max-width:760px}
  .handy .liste:has(> .karte):not(form):not(:has(form,input,select,textarea)){display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
  .handy .raster:not(:has(input,select,textarea))[style*="repeat(2"]{grid-template-columns:repeat(4,minmax(0,1fr))!important}
  .handy h2{font-size:34px}
  #live-leiste{position:fixed;right:24px;top:calc(20px + env(safe-area-inset-top));margin:0;padding:0;z-index:30}
}
@media (min-width: 1280px) {
  .vollbild .handy{padding-left:180px}
  .vollbild .handynav{width:132px;left:24px}
  .vollbild .handynav button{flex-direction:row;justify-content:flex-start;gap:10px;padding:0 14px;min-height:52px;font-size:13px}
  .handy .liste:has(> .karte):not(form):not(:has(form,input,select,textarea)){grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
}
@media (hover: hover) { button:hover:not(:disabled){filter:brightness(1.12)} .karte[data-detail]:hover{border-color:rgba(77,163,255,.5);cursor:pointer} }
</style>

function belegt(studio, tag, von, bis, ohne) {

function extraBelegt(ex, tag, von, bis) {

function nutzbar(kunde, studio, tag, bis) {

}

function creditsBuchen({ kunde, studio, tag, start, std, extras = [], durchTeam = false, seed = false }) {
  const st = ST[studio];
  if (!st || !st.cph) return 'Dieser Raum ist nur für Veranstaltungen.';
  if (!durchTeam && S.gesperrt.includes(kunde)) return 'Ihr Konto ist gesperrt. Bitte melden Sie sich beim Team.';
  if (!durchTeam && !selbstBuchbar(studio, kunde)) return 'NUR_AUF_ANFRAGE';
  if (std < 2) return 'Mindestens 2 Stunden.';
  if (start + std > 24) return 'Die Session muss bis 24:00 enden.';
  if (!seed && abs(tag, start) < JETZT) return 'Dieser Zeitpunkt liegt in der Vergangenheit.';
  if (belegt(studio, tag, start, start + std)) return 'SLOT_BELEGT';
  if (studio === 's1' && belegt('lounge', tag, start, start + std)) return 'SLOT_BELEGT';
  for (const ex of extras) if (extraBelegt(ex, tag, start, start + std)) return EXTRAS[ex].name + ' ist zu dieser Zeit schon vergeben.';
  const mitglied = !!S.kunden[kunde].mitglied;
  const extraCr = extras.reduce((a, ex) => a + (mitglied ? EXTRAS[ex].crMitglied : EXTRAS[ex].cr), 0);
  const bedarf = std * st.cph + extraCr;
  if ((S.kunden[kunde].mitglied || '').startsWith('PA 220') && ['s3', 's4', 's5'].includes(studio)) {
    const genutzt = partnerCreditsImMonat(kunde, tag), max = S.einst.partnerMax220;
    if (genutzt + bedarf > max) return `In Partnerstudios sind pro Monat höchstens ${fmt(max)} Credits Ihrer Mitgliedschaft nutzbar. Übrig: ${fmt(Math.max(0, max - genutzt))}.`;
  }
  const verf = nutzbar(kunde, studio, tag, start + std);
  const summe = verf.reduce((a, x) => a + x.rest, 0);
  if (!verf.length && guthaben(kunde) > 0) return 'Ihre Credits gelten nicht für ' + st.name + '.';
  if (summe < bedarf) return 'ZU_WENIG:' + Math.max(0, Math.floor((summe - extraCr) / st.cph * 2) / 2);
  const id = neueId();
  S.buchungen.push({ id, studio, tag, von: start, bis: start + std, status: 'gebucht', kunde, credits: bedarf, extras, erstattet: false });
  let offen = bedarf;
  for (const x of verf) { if (offen <= 0) break; const n = Math.min(x.rest, offen); S.zuord.push({ buchung: id, posten: x.p.id, credits: n }); offen -= n; }

  return id;
}

function eventPreis(e, mitglied) {

  const [gName, gPreis] = E.getraenke[e.getraenk] || E.getraenke[0];
  if (gPreis) posten.push([`Getränke ${gName} · ${gaeste} × ${gPreis} €`, gaeste * gPreis]);
  if (e.art === 'release' && e.snacks) posten.push([`Snacks · ${gaeste} × ${E.snacks} €`, gaeste * E.snacks]);
  const summe = posten.reduce((a, p) => a + p[1], 0);
  const rabatt = mitglied ? Math.round(summe * 0.15 * 100) / 100 : 0;
  return { posten, summe, rabatt, gesamt: summe - rabatt, gaeste, dauer: E.std + (E.plusStd ? e.plus : 0) };
}
